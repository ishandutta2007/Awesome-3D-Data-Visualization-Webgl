<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0d18"/><stop offset="50%" stop-color="#0e152e"/><stop offset="100%" stop-color="#070913"/></linearGradient><radialGradient id="orb-cyan" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#00f2fe" stop-opacity=".4"/><stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/></radialGradient><radialGradient id="orb-purple" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#9d4edd" stop-opacity=".35"/><stop offset="100%" stop-color="#7928ca" stop-opacity="0"/></radialGradient><radialGradient id="orb-blue" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#4361ee" stop-opacity=".3"/><stop offset="100%" stop-color="#3a0ca3" stop-opacity="0"/></radialGradient><linearGradient id="title-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#fff"/><stop offset="35%" stop-color="#4cc9f0"/><stop offset="70%" stop-color="#7209b7"/><stop offset="100%" stop-color="#f72585"/></linearGradient><linearGradient id="sub-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#a0aec0"/><stop offset="100%" stop-color="#e2e8f0"/></linearGradient><pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#243b61" stroke-opacity=".3" stroke-width=".75" d="M 40 0 L 0 0 0 40"/></pattern><linearGradient id="grid-fade" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="70%" stop-color="#fff" stop-opacity=".3"/><stop offset="100%" stop-color="#fff" stop-opacity=".8"/></linearGradient><mask id="grid-mask"><rect width="1200" height="180" x="0" y="240" fill="url(#grid-fade)"/></mask><style>@keyframes pulseOrb{0%{transform:scale(.9) translate(-20px,-10px);opacity:.6}}@keyframes pulseOrbRev{0%{transform:scale(1.1) translate(15px,20px);opacity:.7}}@keyframes floatSlow{0%{transform:translateY(0) scale(1)}}@keyframes rotateGlobe{0%{transform:rotate(0deg)}}.dynamic-pulse{animation:pulseOrb 6s ease-in-out infinite alternate}.dynamic-pulse-rev{animation:pulseOrbRev 8s ease-in-out infinite alternate}.wave-line{stroke-dasharray:8 6;animation:dashMove 20s linear infinite}.node-float1{animation:floatSlow 5s ease-in-out infinite alternate}.node-float2{animation:floatSlow 7s ease-in-out infinite alternate-reverse}.node-float3{animation:floatSlow 6s ease-in-out infinite alternate}.globe-rotate{animation:rotateGlobe 30s linear infinite;transform-origin:1020px 180px}</style></defs><rect width="1200" height="420" fill="url(#bg-grad)" rx="16"/><circle cx="220" cy="140" r="180" fill="url(#orb-cyan)" class="dynamic-pulse"/><circle cx="980" cy="180" r="220" fill="url(#orb-purple)" class="dynamic-pulse-rev"/><circle cx="600" cy="300" r="160" fill="url(#orb-blue)" class="dynamic-pulse"/><rect width="1200" height="420" fill="url(#cyber-grid)" rx="16"/><g mask="url(#grid-mask)"><line x1="0" x2="1200" y1="410" y2="410" stroke="#00f2fe" stroke-opacity=".6" stroke-width="1.5"/><line x1="0" x2="1200" y1="380" y2="380" stroke="#4cc9f0" stroke-opacity=".4" stroke-width="1.2"/><line x1="0" x2="1200" y1="355" y2="355" stroke="#7209b7" stroke-opacity=".3" stroke-width="1"/><line x1="0" x2="1200" y1="335" y2="335" stroke="#7209b7" stroke-opacity=".2" stroke-width=".8"/><line x1="0" x2="1200" y1="320" y2="320" stroke="#7209b7" stroke-opacity=".15" stroke-width=".5"/><line x1="600" x2="-200" y1="260" y2="420" stroke="#4361ee" stroke-opacity=".4" stroke-width="1"/><line x1="600" x2="0" y1="260" y2="420" stroke="#4361ee" stroke-opacity=".4" stroke-width="1"/><line x1="600" x2="200" y1="260" y2="420" stroke="#4361ee" stroke-opacity=".4" stroke-width="1"/><line x1="600" x2="400" y1="260" y2="420" stroke="#4361ee" stroke-opacity=".4" stroke-width="1.2"/><line x1="600" x2="600" y1="260" y2="420" stroke="#00f2fe" stroke-opacity=".5" stroke-width="1.5"/><line x1="600" x2="